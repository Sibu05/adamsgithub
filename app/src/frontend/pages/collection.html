<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>A2A — My Collection</title>
		<link rel="stylesheet" href="../css/style.css" />
		<link rel="stylesheet" href="../css/account-menu.css" />
		<link rel="stylesheet" href="../css/collection.css" />
	</head>
	<body>
		<header class="site-header">
			<div class="header-inner">
				<a class="logo" href="/">
					<span class="logo-a">A</span>
					<span class="logo-sep">→</span>
					<span class="logo-a">A</span>
					<span class="logo-sub">
						Adamas to Aurum
					</span>
				</a>
				<nav class="header-nav" id="header-nav">
					<a
						href="/"
						class="nav-link hidden"
						id="nav-events"
					>
						<span class="nav-ico">
							<svg
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
							>
								<path
									d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"
								/>
								<circle
									cx="12"
									cy="10"
									r="3"
								/>
							</svg>
						</span>
						Events
					</a>
					<a
						href="collection.html"
						class="nav-link nav-link-active hidden"
						id="nav-collection"
					>
						<span class="nav-ico">
							<svg
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
							>
								<path
									d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"
								/>
								<path
									d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"
								/>
								<path
									d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"
								/>
							</svg>
						</span>
						Collection
					</a>
					<a
						href="battle.html"
						class="nav-link hidden"
						id="nav-battle"
					>
						<span class="nav-ico">
							<svg
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
							>
								<polyline
									points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"
								/>
								<line
									x1="13"
									x2="19"
									y1="19"
									y2="13"
								/>
								<line
									x1="16"
									x2="20"
									y1="16"
									y2="20"
								/>
								<line
									x1="19"
									x2="21"
									y1="21"
									y2="19"
								/>
								<polyline
									points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"
								/>
								<line
									x1="5"
									x2="9"
									y1="14"
									y2="18"
								/>
								<line
									x1="7"
									x2="4"
									y1="17"
									y2="20"
								/>
								<line
									x1="3"
									x2="5"
									y1="19"
									y2="21"
								/>
							</svg>
						</span>
						Battle
					</a>
					<a
						href="spectate.html"
						class="nav-link hidden"
						id="nav-spectate"
					>
						<span class="nav-ico">
							<svg
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
							>
								<path
									d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"
								/>
								<circle
									cx="12"
									cy="12"
									r="3"
								/>
							</svg>
						</span>
						Watch
					</a>
					<a
						href="leaderboard.html"
						class="nav-link hidden"
						id="nav-leaderboard"
					>
						<span class="nav-ico">
							<svg
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
							>
								<path
									d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"
								/>
								<path
									d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"
								/>
								<path
									d="M4 22h16"
								/>
								<path
									d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"
								/>
								<path
									d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"
								/>
								<path
									d="M18 2H6v7a6 6 0 0 0 12 0V2Z"
								/>
							</svg>
						</span>
						Leaderboard
					</a>
					<a
						href="console.html"
						class="nav-link nav-link-admin hidden"
						id="nav-console"
					>
						Console
					</a>
				</nav>
				<div class="header-right">
					<span
						class="admin-badge hidden"
						id="user-badge"
					></span>
					<button
						id="btn-help"
						class="btn btn-sm btn-header"
						title="Help for this page"
						aria-label="Help"
					>
						?
					</button>
					<button id="btn-logout">Logout</button>
					<a
						id="btn-signin"
						href="../index.html"
						class="btn btn-sm btn-header"
					>
						Sign In
					</a>
				</div>
			</div>
		</header>

		<main class="main">
			<div id="toast" class="toast" aria-live="polite"></div>

			<!-- Collection — shown once the auth check passes -->
			<div id="collection-content" class="hidden">
				<div class="page-header">
					<div>
						<h1 class="page-title">
							My Collection
						</h1>
						<p
							class="page-subtitle"
							id="collection-subtitle"
						>
							Loading…
						</p>
					</div>
					<!-- Filter controls -->
					<div
						class="collection-filters"
						id="collection-filters"
						style="display: none"
					>
						<select
							id="filter-category"
							class="filter-select"
						>
							<option value="">
								All categories
							</option>
							<option
								value="CHARACTER"
							>
								Character
							</option>
							<option
								value="LOCATION"
							>
								Location
							</option>
							<option
								value="INFLUENCE"
							>
								Influence
							</option>
							<option
								value="HISTORICAL"
							>
								Historical
							</option>
						</select>
						<select
							id="filter-rarity"
							class="filter-select"
						>
							<option value="">
								All rarities
							</option>
							<option value="COMMON">
								Common
							</option>
							<option value="RARE">
								Rare
							</option>
							<option
								value="LEGENDARY"
							>
								Legendary
							</option>
						</select>
					</div>
				</div>

				<div id="loading" class="state-msg">
					Loading your cards…
				</div>
				<div id="empty" class="state-msg hidden">
					No cards yet — head out to campus events
					to earn your first one.
				</div>
				<div
					id="error"
					class="state-msg error hidden"
				></div>

				<ul id="card-list" class="collection-grid"></ul>
			</div>
		</main>

		<script type="module" src="../js/collection.js"></script>

		<script type="module">
			import {
				attachHelpButton,
				currentPageKey,
			} from '../js/help-modal.js'
			attachHelpButton('btn-help', currentPageKey())
		</script>
	</body>
</html>
